[package]
name = "lumo"
description = "Lumo for Windows and Linux — a small ring of light at the top of your screen"
authors = ["Louis Raille", "Riccardo Gentili"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "lumo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
# The autostart plugin's own crate, to remove the entry it wrote under the
# app's old name (autostart.rs). Already in the tree, nothing new is compiled.
auto-launch = "0.5"
tauri-plugin-global-shortcut = "2"
# "Attach a file" in the chat: the native file picker, called from Rust only.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# The Email pill reads the inbox over IMAP with TLS (mail.rs): the TLS and the
# root certificates reqwest already runs on, so nothing new is compiled.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# The island's file drop reads paths straight from WebView2 (webview_drop.rs).
# Same versions as wry, so nothing new is compiled.
webview2-com = "0.39"
wv2_core = { package = "windows-core", version = "0.62" }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  # The music playing, for the closed island (media.rs): the system's media
  # controls, the ones the volume flyout shows.
  "Media_Control",
  # The chat's screen button (screen.rs): the window list skips cloaked
  # windows, GDI copies a display, WIC writes the PNG.
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Imaging",
  "Win32_Security",
  "Win32_Security_Authorization",
  # "Tell the AI what's open" (desk.rs): where the Recent folder's shortcuts point.
  "Win32_Storage_FileSystem",
  # "Open terminal": the relay's process tree leads to the session's window.
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  # "Ask about the selected text": copy in the app in front, then put the
  # clipboard back (selection.rs).
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Ole",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  # "Folder open in File Explorer" in the chat (explorer.rs): IShellWindows
  # and the folder of each window, which take and return VARIANTs.
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Secret Service (GNOME Keyring, KWallet) over D-Bus, encrypted in transit.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
libc = "0.2"
# The music playing, for the closed island (media.rs): MPRIS over D-Bus. The
# version the Secret Service above runs on: nothing new is compiled.
dbus = "0.9"
# The GTK that Tauri already runs on, to reach its window for layer-shell and
# the input region. libgtk-layer-shell itself is called directly (platform/linux.rs).
gtk = "0.18"
# The island's webview, to let it use the microphone once a Gemini Live
# conversation starts (live.rs). The version wry runs on: nothing new is compiled.
webkit2gtk = "2.0"
