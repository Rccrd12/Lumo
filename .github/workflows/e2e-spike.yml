name: E2E spike

# Feasibility spike for end-to-end tests: builds Lumo, starts it under
# tauri-driver + msedgedriver and drives one permission card through the real
# relay. Runs only on its own branch and by hand; nothing is published.

on:
  push:
    branches: [claude/project-thread-pe9vw3]
    paths:
      - 'windows/e2e/**'
      - '.github/workflows/e2e-spike.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/tauri-driver.exe
            windows/target
          key: e2e-cargo-${{ github.repository }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            e2e-cargo-${{ github.repository }}-
            windows-ci-cargo-${{ github.repository }}-

      - name: Install dependencies
        run: npm ci

      - name: Build the relay
        run: cargo build --release -p lumo-hook --locked

      - name: Build Lumo (debug, no installer)
        run: npx tauri build --debug --no-bundle

      - name: Install tauri-driver
        run: if (!(Get-Command tauri-driver -ErrorAction SilentlyContinue)) { cargo install tauri-driver --locked }

      - name: msedgedriver matching WebView2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $v = (Get-ItemProperty $key).pv
          Write-Host "WebView2 runtime $v"
          $zip = "$env:RUNNER_TEMP\edgedriver.zip"
          try { Invoke-WebRequest "https://msedgedriver.microsoft.com/$v/edgedriver_win64.zip" -OutFile $zip }
          catch { Invoke-WebRequest "https://msedgedriver.azureedge.net/$v/edgedriver_win64.zip" -OutFile $zip }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "$env:RUNNER_TEMP\edgedriver" | Out-File -Append $env:GITHUB_PATH
          Get-ChildItem "$env:RUNNER_TEMP\edgedriver"

      - name: Session info
        shell: pwsh
        run: |
          query user 2>$null
          [System.Windows.Forms.Screen]::AllScreens 2>$null
          Add-Type -AssemblyName System.Windows.Forms; [System.Windows.Forms.Screen]::AllScreens | Format-List

      - name: Spike
        shell: pwsh
        run: |
          $driver = Start-Process tauri-driver -ArgumentList '--native-driver',"$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\driver.out" -RedirectStandardError "$env:RUNNER_TEMP\driver.err"
          Start-Sleep 3
          $t0 = Get-Date
          node e2e/spike.mjs "$PWD\target\debug\lumo.exe" "$PWD\target\release\lumo-hook.exe" "$PWD\e2e-out"
          $code = $LASTEXITCODE
          Write-Host "spike took $(((Get-Date) - $t0).TotalSeconds) s, exit $code"
          Stop-Process $driver -ErrorAction SilentlyContinue
          Get-Content "$env:RUNNER_TEMP\driver.out","$env:RUNNER_TEMP\driver.err" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Copy-Item -Recurse "$env:APPDATA\com.rccrd12.lumo" e2e-out\appdata -ErrorAction SilentlyContinue
          Copy-Item -Recurse "$env:LOCALAPPDATA\com.rccrd12.lumo" e2e-out\localappdata -Exclude EBWebView -ErrorAction SilentlyContinue
          exit $code

      - name: Desktop screenshot
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force e2e-out | Out-Null
          $bmp.Save("$PWD\e2e-out\desktop.png")

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: e2e-spike
          path: windows/e2e-out
          retention-days: 7
