name: Windows

# Builds the Windows app and publishes the installer.
# Triggered by tags like `windows-v0.1.0`.

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

# Read-only by default: only the publish job, which builds nothing, may write
# (the release and the windows-latest tag).
permissions:
  contents: read

# Publishing is on. A new unsigned build can trip Defender's machine-learning
# model (Trojan:Win32/Wacatac.H!ml, then Trojan:Win32/Bearfoos.A!ml): the build
# job scans what ships with Defender and stops on a detection. Set this to
# 'false' to build tags without publishing.
env:
  PUBLISH: 'true'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.pack.outputs.version }}
    defaults:
      run:
        working-directory: windows

    steps:
      # The token stays out of .git/config while npm and the crates' build
      # scripts run; this job pushes nothing.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The same Node as Windows CI and the beta: the tests need 22.18 or newer.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          # The build caches absolute paths: the key names the repo, so a cache
          # from a repository under another name is never restored.
          key: windows-cargo-${{ github.repository }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-cargo-${{ github.repository }}-

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently. Publishing a
      # "0.1.1" that installs a 0.1.0 is the kind of thing nobody notices until
      # a bug report arrives against the wrong build.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # The checks of Windows CI again, on the very commit the tag names: a tag
      # on a commit whose tests fail is never packed, signed or published. One
      # command per step: PowerShell carries on after a failed command in the
      # same step.
      - name: Island tests
        run: npm test

      - name: Build the relay
        run: cargo build --release -p lumo-hook --locked

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # A crate with a known vulnerability (RustSec) stops the release.
      # Warnings (unmaintained, yanked, the Linux-only GTK crates) do not.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Rust advisories
        run: cargo audit

      # `npm run build` (run by tauri as beforeBuildCommand) builds the relay (lumo-hook)
      # first, which tauri.conf.json then bundles as a resource. `pack` then
      # copies the installer out of target/ under its shipping name.
      - name: Build and pack the installer
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      # Defender's machine-learning model has flagged unsigned builds before
      # (Trojan:Win32/Wacatac.H!ml, Trojan:Win32/Bearfoos.A!ml). What ships is
      # scanned here with Defender's newest definitions, and a detection stops
      # the job: nothing Defender flags is published. Its cloud model can still
      # flag a build later on a PC: then the file goes to Microsoft for review.
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "Microsoft Defender is not on this runner" }
          & $mp -SignatureUpdate | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Warning "Defender's definitions were not updated (exit $LASTEXITCODE): the runner's own are used" }
          $files = @(Get-Item target/release/lumo.exe, target/release/lumo-hook.exe) +
            @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          $flagged = @()
          foreach ($f in $files) {
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $flagged += $f.Name }
            elseif ($LASTEXITCODE -ne 0) { throw "Defender could not scan $($f.Name) (exit $LASTEXITCODE)" }
          }
          if ($flagged) {
            throw "Microsoft Defender flags $($flagged -join ', '): not published. Send the file to https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer, Incorrectly detected)."
          }
          "Microsoft Defender: $($files.Count) files clean"

      # Upload only on a manual run or when publishing a release.
      # The repo is public, so artifacts are downloadable by any signed-in GitHub
      # user; the condition keeps them off automatic tag builds while downloads
      # are paused. retention-days: 3 limits exposure.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: Lumo-Windows-setup
          path: windows/release/Lumo-Windows-${{ steps.pack.outputs.version }}-setup.exe
          retention-days: 3

      # MSI installer generated via WiX toolset. Bypasses NSIS extractor false-positives
      # and provides clean native Windows Installer deployment.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: Lumo-Windows-msi
          path: windows/release/Lumo-Windows-${{ steps.pack.outputs.version }}.msi
          retention-days: 3

      # The unsigned NSIS installer is what Defender false-positives on, so the
      # bare binaries go up as well. hooks.rs already falls back to looking for
      # lumo-hook.exe next to the app's exe, which is exactly this layout, so
      # the portable pair runs with working Claude Code hooks and no installer.
      # `tauri build` names the app's exe lumo.exe (mainBinaryName in
      # src-tauri/tauri.windows.conf.json), as cargo does.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'workflow_dispatch' || env.PUBLISH == 'true'
        with:
          name: Lumo-Windows-portable
          path: |
            windows/target/release/lumo.exe
            windows/target/release/lumo-hook.exe
          retention-days: 3

      # What the publish job puts on the release: the installers under their
      # versioned names and the rolling windows-latest ones.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUBLISH == 'true' && startsWith(github.ref, 'refs/tags/windows-v')
        with:
          name: Lumo-Windows-release
          path: |
            windows/release/Lumo-Windows-${{ steps.pack.outputs.version }}-setup.exe
            windows/release/Lumo-Windows-${{ steps.pack.outputs.version }}.msi
            windows/release/Lumo-Windows-setup.exe
            windows/release/Lumo-Windows.msi
          retention-days: 1

  # The only job that may write: it publishes what the build job made, and
  # compiles or runs nothing of its own.
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/windows-v')
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: env.PUBLISH == 'true'
        with:
          name: Lumo-Windows-release
          path: windows/release

      # Lumo installs an update only with its own signature beside it
      # (src-tauri/src/updater.rs, UPDATE_PUBLIC_KEY): each installer is signed
      # here, in the job that builds nothing, with the LUMO_UPDATE_KEY secret
      # (scripts/update-key.mjs). Without the secret, or with one that does not
      # match the key Lumo carries, nothing is published.
      - name: Sign the installers
        if: env.PUBLISH == 'true'
        env:
          LUMO_UPDATE_KEY: ${{ secrets.LUMO_UPDATE_KEY }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          node scripts/sign-update.mjs "release/Lumo-Windows-$v-setup.exe" "release/Lumo-Windows-$v.msi"
          if ($LASTEXITCODE -ne 0) { throw "the installers could not be signed" }

      - name: Publish the release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $notes = @"
          Lumo for Windows $v — a small ring of light at the top of your screen.

          Download ``Lumo-Windows-$v.msi`` (Windows Installer) or ``Lumo-Windows-$v-setup.exe`` and run it. The installer is not
          code-signed yet, so Windows SmartScreen shows a warning: click
          **More info → Run anyway**.
          "@
          # The tag may come with its release, published by hand on GitHub
          # (this token may not push a tag): then the installers and notes go
          # on that release instead of a new one.
          $exists = gh release view "${{ github.ref_name }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" `
              "release/Lumo-Windows-$v-setup.exe" `
              "release/Lumo-Windows-$v-setup.exe.sig" `
              "release/Lumo-Windows-$v.msi" `
              "release/Lumo-Windows-$v.msi.sig" `
              --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload to ${{ github.ref_name }} failed" }
            gh release edit "${{ github.ref_name }}" `
              --title "Lumo for Windows $v" `
              --notes $notes `
              --prerelease=false `
              --draft=false `
              --latest=false
          } else {
            # --latest=false: the download links point at the rolling
            # windows-latest release below, not at GitHub's Latest slot.
            gh release create "${{ github.ref_name }}" `
              "release/Lumo-Windows-$v-setup.exe" `
              "release/Lumo-Windows-$v-setup.exe.sig" `
              "release/Lumo-Windows-$v.msi" `
              "release/Lumo-Windows-$v.msi.sig" `
              --title "Lumo for Windows $v" `
              --notes $notes `
              --latest=false
          }

      - name: Update the rolling windows-latest release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $exists = gh release view windows-latest 2>$null
          if ($LASTEXITCODE -eq 0) {
            # The tag has to follow the release, or windows-latest keeps pointing
            # at the first commit it was ever created from and anyone building
            # from it gets an old tree.
            git tag -f windows-latest "${{ github.sha }}"
            git push -f origin windows-latest
            gh release edit windows-latest --title "Lumo for Windows (latest)" --notes "Always the newest Windows build — currently $v."
            gh release upload windows-latest "release/Lumo-Windows-setup.exe" "release/Lumo-Windows.msi" --clobber
          } else {
            gh release create windows-latest `
              "release/Lumo-Windows-setup.exe" `
              "release/Lumo-Windows.msi" `
              --title "Lumo for Windows (latest)" `
              --notes "Always the newest Windows build — currently $v." `
              --latest=false
          }
