name: Windows CI

# Type-checks and tests the Windows app on every pull request that touches it.
# Nothing is packed and nothing is published: releases stay in windows.yml,
# which only runs on tags.

on:
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - '.github/workflows/windows-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The tests run the TypeScript sources directly, which needs Node 22.18
      # or newer; 24 is the version they are run with locally.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
          # The build caches absolute paths: the key names the repo, so a cache
          # from a repository under another name is never restored.
          key: windows-ci-cargo-${{ github.repository }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: windows-ci-cargo-${{ github.repository }}-

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      # The app bundles target/release/lumo-hook.exe as a resource, and its
      # build script refuses to run until that file exists. One command per
      # step: PowerShell carries on after a failed command in the same step.
      - name: Build the relay
        run: cargo build --release -p lumo-hook --locked

      # Dead code and the like fail the build here rather than piling up.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # Known vulnerabilities (RustSec) in Cargo.lock show up on the first pull
      # request after they are published. Here it only warns, so an advisory
      # that has nothing to do with a pull request keeps none out of the beta;
      # the release (windows.yml) stops on one.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-audit

      - name: Rust advisories
        continue-on-error: true
        run: cargo audit
