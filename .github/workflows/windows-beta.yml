name: Windows beta

# The beta channel (Settings → Updates → Beta versions): main with every open
# pull request of this repository merged into it, tested, packed and published
# as the one `windows-beta` pre-release, which replaces the one before. Lumo
# offers it only to whoever turned Beta versions on.
#
# It runs each time Windows CI ends (on main or on a pull request), after
# each release (the Windows workflow), and by hand. A pull request merged into main comes back with main's CI; one closed
# without merging leaves the beta at the next build. It never runs on a
# pull_request event: the token GitHub gives those may not publish a release. Only pull requests whose own Windows
# CI passed on their latest commit go in: one that fails, or whose checks are
# still running, is left out this time and says so, so a broken pull request
# never holds the others back. One that does not merge is left out too, and
# the release's notes say what it conflicts with (scripts/beta.mjs). When the
# tests of the whole fail, nothing is published and the beta before stays.
# Pull requests from forks never take part: their code is never checked out
# here. Nor do those that change nothing in the app (only tests, screenshots
# or notes); when the beta would hold nothing the last release does not, it is
# taken down instead, so Lumo offers no beta that is the release again.

on:
  workflow_run:
    workflows: ["Windows CI", "Windows"]
    types: [completed]
  workflow_dispatch:

# Read-only by default: only the publish job, which runs none of the pull
# requests' code, may write (the release).
permissions:
  contents: read

# One build at a time, each to its end; a newer request waits for it (and
# replaces any other that was waiting), so busy pull requests never keep the
# beta from being published.
concurrency:
  group: windows-beta
  cancel-in-progress: false

jobs:
  beta:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped')
    runs-on: windows-latest
    # Merges, tests and packs the pull requests' code: it can read, never write.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      changes: ${{ steps.merge.outputs.changes }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: windows
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
            ~/AppData/Local/tauri
          key: windows-beta-cargo-${{ github.repository }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            windows-beta-cargo-${{ github.repository }}-
            windows-cargo-${{ github.repository }}-

      # The script is read before anything is merged: a pull request cannot
      # change how it is merged.
      - name: Merge the open pull requests into main
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/beta.mjs merge "$RUNNER_TEMP/beta.json"

      - name: Install dependencies
        if: steps.merge.outputs.changes == 'true'
        run: npm ci

      - name: Type check
        if: steps.merge.outputs.changes == 'true'
        run: npx tsc --noEmit

      - name: Island tests
        if: steps.merge.outputs.changes == 'true'
        run: npm test

      - name: Build the relay
        if: steps.merge.outputs.changes == 'true'
        run: cargo build --release -p lumo-hook --locked

      - name: Rust tests
        if: steps.merge.outputs.changes == 'true'
        run: cargo test --workspace --locked

      - name: Set the beta's version
        if: steps.merge.outputs.changes == 'true'
        id: version
        run: echo "version=$(node scripts/beta.mjs version ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Build and pack the installer
        if: steps.merge.outputs.changes == 'true'
        run: |
          npm run pack
          ls -l release

      # Defender's machine-learning model has flagged unsigned builds before
      # (Trojan:Win32/Wacatac.H!ml, Trojan:Win32/Bearfoos.A!ml). What ships is
      # scanned here with Defender's newest definitions, and a detection stops
      # the job: nothing Defender flags is published. Its cloud model can still
      # flag a build later on a PC: then the file goes to Microsoft for review.
      - name: Scan with Microsoft Defender
        if: steps.merge.outputs.changes == 'true'
        shell: pwsh
        run: |
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          if (-not (Test-Path $mp)) { throw "Microsoft Defender is not on this runner" }
          & $mp -SignatureUpdate | Out-Host
          if ($LASTEXITCODE -ne 0) { Write-Warning "Defender's definitions were not updated (exit $LASTEXITCODE): the runner's own are used" }
          $files = @(Get-Item target/release/lumo.exe, target/release/lumo-hook.exe) +
            @(Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe', '.msi' })
          $flagged = @()
          foreach ($f in $files) {
            & $mp -Scan -ScanType 3 -File $f.FullName -DisableRemediation | Out-Host
            if ($LASTEXITCODE -eq 2) { $flagged += $f.Name }
            elseif ($LASTEXITCODE -ne 0) { throw "Defender could not scan $($f.Name) (exit $LASTEXITCODE)" }
          }
          if ($flagged) {
            throw "Microsoft Defender flags $($flagged -join ', '): not published. Send the file to https://www.microsoft.com/en-us/wdsi/filesubmission (Software developer, Incorrectly detected)."
          }
          "Microsoft Defender: $($files.Count) files clean"

      - name: Write the beta's notes
        if: steps.merge.outputs.changes == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/beta.mjs notes "$RUNNER_TEMP/beta.json" "$VERSION" > release/beta-notes.md

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.merge.outputs.changes == 'true'
        with:
          name: windows-beta
          path: |
            windows/release/Lumo-Windows-${{ steps.version.outputs.version }}-setup.exe
            windows/release/Lumo-Windows-${{ steps.version.outputs.version }}.msi
            windows/release/beta-notes.md
          retention-days: 1

  # The only job that may write: it publishes what the beta job packed, or
  # takes the beta down, and runs nothing from the pull requests.
  publish:
    needs: beta
    if: needs.beta.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: needs.beta.outputs.changes == 'true'
        with:
          name: windows-beta
          path: release

      # Lumo installs an update only with its own signature beside it
      # (windows/src-tauri/src/updater.rs): signed here with the
      # LUMO_UPDATE_KEY secret, by the script as main has it, never in the job
      # that runs the pull requests' code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.beta.outputs.changes == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: main
          persist-credentials: false
          sparse-checkout: |
            windows/scripts/sign-update.mjs
            windows/src-tauri/src/updater.rs
          sparse-checkout-cone-mode: false

      - name: Sign the installers
        if: needs.beta.outputs.changes == 'true'
        env:
          LUMO_UPDATE_KEY: ${{ secrets.LUMO_UPDATE_KEY }}
          VERSION: ${{ needs.beta.outputs.version }}
        run: node main/windows/scripts/sign-update.mjs "release/Lumo-Windows-$VERSION-setup.exe" "release/Lumo-Windows-$VERSION.msi"

      - name: Publish the beta
        if: needs.beta.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.beta.outputs.version }}
        run: |
          # The windows-beta tag stays where it is: GitHub refuses this token
          # the creation of a tag (HTTP 403), so it was pushed once by hand and
          # only the release on it is replaced. The notes name main's commit.
          gh release delete windows-beta --repo "$GITHUB_REPOSITORY" --yes || true
          gh release create windows-beta \
            "release/Lumo-Windows-$VERSION-setup.exe" \
            "release/Lumo-Windows-$VERSION-setup.exe.sig" \
            "release/Lumo-Windows-$VERSION-setup.exe.name.sig" \
            "release/Lumo-Windows-$VERSION.msi" \
            "release/Lumo-Windows-$VERSION.msi.sig" \
            "release/Lumo-Windows-$VERSION.msi.name.sig" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "Lumo for Windows beta $VERSION" \
            --notes-file release/beta-notes.md

      - name: Take the beta down, it holds nothing new
        if: needs.beta.outputs.changes == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete windows-beta --repo "$GITHUB_REPOSITORY" --yes || true
