name: Windows beta

# The beta channel (Settings → Updates → Beta versions): main with every open
# pull request of this repository merged into it, tested, packed and published
# as the one `windows-beta` pre-release, which replaces the one before. Lumo
# offers it only to whoever turned Beta versions on.
#
# It runs each time Windows CI ends (on main or on a pull request), when a
# pull request is closed, and by hand. Only pull requests whose own Windows
# CI passed on their latest commit go in: one that fails, or whose checks are
# still running, is left out this time and says so, so a broken pull request
# never holds the others back. One that does not merge is left out too, and
# the release's notes say what it conflicts with (scripts/beta.mjs). When the
# tests of the whole fail, nothing is published and the beta before stays.
# Pull requests from forks never take part: their code is never checked out
# here.

on:
  workflow_run:
    workflows: ["Windows CI"]
    types: [completed]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  checks: read

# One build at a time, each to its end; a newer request waits for it (and
# replaces any other that was waiting), so busy pull requests never keep the
# beta from being published.
concurrency:
  group: windows-beta
  cancel-in-progress: false

jobs:
  beta:
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) &&
      (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'))
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
        shell: bash

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: windows/package-lock.json

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            windows/target
            ~/AppData/Local/tauri
          key: windows-beta-cargo-${{ github.repository }}-${{ hashFiles('windows/Cargo.lock') }}
          restore-keys: |
            windows-beta-cargo-${{ github.repository }}-
            windows-cargo-${{ github.repository }}-

      # The script is read before anything is merged: a pull request cannot
      # change how it is merged.
      - name: Merge the open pull requests into main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/beta.mjs merge "$RUNNER_TEMP/beta.json"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Island tests
        run: npm test

      - name: Build the relay
        run: cargo build --release -p lumo-hook

      - name: Rust tests
        run: cargo test --workspace --locked

      - name: Set the beta's version
        id: version
        run: echo "version=$(node scripts/beta.mjs version ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Build and pack the installer
        run: |
          npm run pack
          ls -l release

      - name: Publish the beta
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/beta.mjs notes "$RUNNER_TEMP/beta.json" "$VERSION" > "$RUNNER_TEMP/notes.md"
          main=$(node -p "require(process.env.RUNNER_TEMP + '/beta.json').main")
          gh release delete windows-beta --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          gh release create windows-beta \
            "release/Lumo-Windows-$VERSION-setup.exe" \
            "release/Lumo-Windows-$VERSION.msi" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$main" \
            --prerelease \
            --latest=false \
            --title "Lumo for Windows beta $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
